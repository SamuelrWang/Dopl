openapi: 3.1.0
info:
  title: Dopl Device SDK API
  version: "2026-10-28"
  summary: The /v1 surface of the Dopl Device SDK (frozen contracts v1).
  description: |
    Field-for-field mirror of `packages/device-contracts/src/*` (zod). The TypeScript contracts
    are the source of truth; a change to either is a change to both, and only by a maintainer ruling
    plus a changelog line.

    Every action is async and idempotent. Every error uses the one `ErrorResponse` shape (C10).

    `info.version` is the spec revision. The dated API version a project is pinned to stays
    `2026-10-27`: every change since is additive (see SPEC-v1 › Changelog).

    Every list route uses one envelope: `cursor` + `limit` in, `{ data, next_cursor, has_more }` out.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.usedopl.com/v1
    description: Planned host (not live yet).
security:
  - secretKey: []
tags:
  - name: connect
    description: C2 Connect flow and connections.
  - name: context
    description: C5 device context.
  - name: actions
    description: C4 intent-level deliver and device-level actions.
  - name: devices
    description: C3 devices and capability descriptors.
  - name: events
    description: C8 request log, read back by the developer.
  - name: webhooks
    description: C8 webhook endpoints, deliveries and replay (Standard Webhooks signing).

paths:
  /connect_sessions:
    post:
      tags: [connect]
      operationId: createConnectSession
      summary: Create a Connect session
      description: Callable with a secret key or a publishable (`pk_`) key; the only route a publishable key may call. Key scope `connect`.
      security:
        - secretKey: []
        - publishableKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectSessionCreateRequest" }
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectSessionCreateResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /connections/exchange:
    post:
      tags: [connect]
      operationId: exchangePublicToken
      summary: Exchange the widget's public token for a connection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionExchangeRequest" }
      responses:
        "200":
          description: The durable connection and its device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionExchangeResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users/{external_user_id}/connections:
    get:
      tags: [connect]
      operationId: listConnections
      summary: List an end user's connections
      parameters:
        - $ref: "#/components/parameters/ExternalUserId"
      responses:
        "200":
          description: The user's connections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionListResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /connections/{id}:
    delete:
      tags: [connect]
      operationId: revokeConnection
      summary: Revoke a connection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The revoked connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users/{external_user_id}/context:
    get:
      tags: [context]
      operationId: getContext
      summary: The user's device context
      parameters:
        - $ref: "#/components/parameters/ExternalUserId"
      responses:
        "200":
          description: Active device, posture, available devices and the matched profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceContext" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users/{external_user_id}/deliver:
    post:
      tags: [actions]
      operationId: deliver
      summary: Deliver by intent; Dopl routes to a device (C5)
      description: "An `ask` holds for up to 200s for the answer, unless the request sends `Prefer: respond-async`."
      parameters:
        - $ref: "#/components/parameters/ExternalUserId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Prefer"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverRequest" }
      responses:
        "202":
          description: Accepted and routed.
          headers:
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /devices/{device_id}/actions/{capability}:
    post:
      tags: [actions]
      operationId: createDeviceAction
      summary: Run one capability on one device
      description: "T4 capabilities return `needs_confirmation` first (C7). `ask.*` actions hold for up to 200s, unless the request sends `Prefer: respond-async`."
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: capability
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CapabilityId" }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Prefer"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceActionRequest" }
      responses:
        "202":
          description: Accepted.
          headers:
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceActionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /actions/{id}:
    get:
      tags: [actions]
      operationId: getAction
      summary: Poll an action
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /devices/{id}:
    get:
      tags: [devices]
      operationId: getDevice
      summary: A device and its capability descriptors
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: List this project's request log
      description: |
        The calls made with this key's project and environment, newest first. Needs the
        `analytics:read` scope. Reading the log is not itself logged. Rate limited per key.
      parameters:
        - $ref: "#/components/parameters/ListCursor"
        - $ref: "#/components/parameters/ListLimit"
        - name: since
          in: query
          required: false
          description: Oldest event to include. Defaults to 24 hours ago; at most 30 days ago.
          schema: { type: string, format: date-time }
        - name: outcome
          in: query
          required: false
          schema: { $ref: "#/components/schemas/EventOutcome" }
        - name: device_kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DeviceKind" }
        - name: capability
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CapabilityId" }
        - name: intent
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DeliverIntent" }
        - name: route
          in: query
          required: false
          description: The `route_decision.target` the call asked for (`auto`, a kind, a device id).
          schema: { type: string, pattern: "^[A-Za-z0-9_.:@-]{1,128}$" }
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /webhook_endpoints:
    post:
      tags: [webhooks]
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: |
        https only; the host must resolve to public addresses. The answer carries the signing
        secret (`whsec_…`): store it now, it is shown again only on rotate. Every POST to the
        endpoint is signed per Standard Webhooks (`webhook-id`, `webhook-timestamp`,
        `webhook-signature`) and carries a `WebhookEventEnvelope` body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEndpointCreateRequest" }
      responses:
        "201":
          description: The endpoint, with its secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointWithSecret" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      tags: [webhooks]
      operationId: listWebhookEndpoints
      summary: List webhook endpoints (newest first)
      parameters:
        - $ref: "#/components/parameters/ListCursor"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /webhook_endpoints/{id}:
    get:
      tags: [webhooks]
      operationId: getWebhookEndpoint
      summary: A webhook endpoint
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      responses:
        "200":
          description: The endpoint (never its secret).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [webhooks]
      operationId: updateWebhookEndpoint
      summary: Change url, description, events, or disable / enable
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEndpointUpdateRequest" }
      responses:
        "200":
          description: The updated endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [webhooks]
      operationId: deleteWebhookEndpoint
      summary: Delete an endpoint and its delivery log
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointDeleted" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /webhook_endpoints/{id}/rotate_secret:
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret
      description: The new secret is answered once. The old one keeps signing alongside it for `overlap_seconds`.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookSecretRotateRequest" }
      responses:
        "200":
          description: The endpoint, with its new secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointWithSecret" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /webhook_endpoints/{id}/deliveries:
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: An endpoint's deliveries (newest first)
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
        - $ref: "#/components/parameters/ListCursor"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /webhook_deliveries/{id}:
    get:
      tags: [webhooks]
      operationId: getWebhookDelivery
      summary: A delivery with every HTTP attempt
      parameters:
        - $ref: "#/components/parameters/WebhookDeliveryId"
      responses:
        "200":
          description: The delivery, `attempts` newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /webhook_deliveries/{id}/replay:
    post:
      tags: [webhooks]
      operationId: replayWebhookDelivery
      summary: Send a delivery again
      description: Queued now with a fresh retry budget, same `webhook-id`. Refused while the endpoint is disabled.
      parameters:
        - $ref: "#/components/parameters/WebhookDeliveryId"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

webhooks:
  dopl-event:
    post:
      tags: [webhooks]
      operationId: receiveDoplEvent
      summary: What Dopl POSTs to your endpoint
      description: Verify with `dopl.webhooks.unwrap(rawBody, headers, { secret })`, answer 2xx within 15s.
      parameters:
        - { name: webhook-id, in: header, required: true, schema: { type: string } }
        - { name: webhook-timestamp, in: header, required: true, schema: { type: string } }
        - { name: webhook-signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEventEnvelope" }
      responses:
        "200":
          description: Any 2xx marks the delivery delivered.

components:
  securitySchemes:
    secretKey:
      type: http
      scheme: bearer
      description: "`sk_test_…` or `sk_live_…` (C1). Server-to-server only."
    publishableKey:
      type: http
      scheme: bearer
      description: "`pk_…` (C1). May only call POST /connect_sessions."

  parameters:
    ExternalUserId:
      name: external_user_id
      in: path
      required: true
      description: The developer's own id for the end user (no Dopl account, D1).
      schema: { type: string, minLength: 1, maxLength: 255 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional on every POST. Where the body also carries `idempotency_key`, both must match; reusing a key with a different body is `idempotency_conflict`.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Prefer:
      name: Prefer
      in: header
      required: false
      description: "`respond-async` (RFC 7240): do not hold an `ask` for its answer. The 202 returns at once with status `queued` or `delivered`; read the answer with GET /actions/{id} or the `action.completed` webhook. Other preferences are ignored."
      schema: { type: string, example: respond-async }

    ListCursor:
      name: cursor
      in: query
      required: false
      description: Opaque. Pass back the `next_cursor` of the previous page, unchanged. Omit for the first page.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,512}$" }
    ListLimit:
      name: limit
      in: query
      required: false
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

    WebhookEndpointId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookDeliveryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    PreferenceApplied:
      description: "`respond-async` when the request asked for it and an open ask returned without its hold (absent on non-asks and stored replays)."
      schema: { type: string }

  responses:
    Error:
      description: The one error shape (C10).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ── C3 ──────────────────────────────────────────────────────────────
    DeviceKind:
      type: string
      enum: [glasses, phone, desktop, watch, home_hub, home_device, vehicle, robot]
    RiskTier:
      type: string
      enum: [T0, T1, T2, T3, T4]
    CapabilityId:
      type: string
      enum:
        - state.read
        - telemetry.read
        - presence.read
        - present.notify
        - present.display
        - present.speak
        - present.haptic
        - ask.choice
        - ask.confirm
        - ask.text
        - capture.photo
        - capture.audio
        - capture.video_stream
        - capture.screen
        - input.utterance
        - input.tap
        - input.gesture
        - input.button
        - act.set
        - act.media
        - act.navigate
        - act.lock
        - act.motion.move
        - act.motion.gripper
        - act.motion.vehicle
    CapabilityScope:
      description: A capability id, or a whole family as `<family>.*`.
      oneOf:
        - $ref: "#/components/schemas/CapabilityId"
        - type: string
          enum: [state.*, present.*, ask.*, capture.*, input.*, act.*, act.motion.*]
    LatencyClass:
      type: string
      enum: [realtime, interactive, deferred]
    CapabilityDescriptor:
      type: object
      required: [capability, limits, latency_class, risk_tier, since_adapter]
      properties:
        capability: { $ref: "#/components/schemas/CapabilityId" }
        limits:
          type: object
          additionalProperties:
            type: [number, string, boolean]
        latency_class: { $ref: "#/components/schemas/LatencyClass" }
        risk_tier: { $ref: "#/components/schemas/RiskTier" }
        since_adapter:
          type: string
          pattern: "^[a-z0-9_]+@[0-9][0-9A-Za-z.+-]*$"
          examples: ["even_g2@0.3"]
    Device:
      type: object
      required: [id, kind, vendor, model, firmware, adapter_id, adapter_version, capabilities, online, last_seen_at]
      properties:
        id: { type: string, minLength: 1 }
        kind: { $ref: "#/components/schemas/DeviceKind" }
        vendor: { type: string }
        model: { type: string }
        firmware: { type: [string, "null"] }
        adapter_id: { type: string, minLength: 1 }
        adapter_version: { type: string, minLength: 1 }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/CapabilityDescriptor" }
        online: { type: boolean }
        last_seen_at: { type: [string, "null"], format: date-time }

    # ── C2 ──────────────────────────────────────────────────────────────
    ConnectBranding:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 80 }
        logo_url: { type: string, format: uri }
        accent_color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
    ConnectSessionCreateRequest:
      type: object
      required: [external_user_id, requested_scopes]
      properties:
        external_user_id: { type: string, minLength: 1, maxLength: 255 }
        allowed_kinds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DeviceKind" }
        requested_scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CapabilityScope" }
        redirect_uri: { type: string, format: uri }
        branding: { $ref: "#/components/schemas/ConnectBranding" }
    ConnectSessionCreateResponse:
      type: object
      required: [connect_token, url, expires_at]
      properties:
        connect_token: { type: string, minLength: 1 }
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    ConnectionExchangeRequest:
      type: object
      required: [public_token]
      properties:
        public_token: { type: string, minLength: 1 }
    ConnectionExchangeResponse:
      type: object
      required: [connection_id, device]
      properties:
        connection_id: { type: string, minLength: 1 }
        device: { $ref: "#/components/schemas/Device" }
    Grant:
      type: object
      required: [scope, granted_at, expires_at]
      properties:
        scope: { $ref: "#/components/schemas/CapabilityScope" }
        granted_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
    ConnectionStatus:
      type: string
      enum: [active, needs_reauth, revoked]
    Connection:
      type: object
      required: [id, external_user_id, status, device, grants, created_at, revoked_at]
      properties:
        id: { type: string, minLength: 1 }
        external_user_id: { type: string, minLength: 1, maxLength: 255 }
        status: { $ref: "#/components/schemas/ConnectionStatus" }
        device: { $ref: "#/components/schemas/Device" }
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
    ConnectionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Connection" }

    # ── C6 (block vocabulary v2 + image) ────────────────────────────────
    BlockId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,32}$"
    ChoiceOption:
      type: object
      required: [label]
      properties:
        label: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 200 }
        recommended: { type: boolean, const: true }
        why: { type: string, maxLength: 200 }
    HeadingBlock:
      type: object
      required: [id, type, text]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        type: { type: string, const: heading }
        text: { type: string, maxLength: 120 }
    TextBlock:
      type: object
      required: [id, type, content]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        type: { type: string, const: text }
        content: { type: string, maxLength: 2000 }
        tone: { type: string, enum: [muted, strong] }
        lines: { type: integer, minimum: 1, maximum: 40 }
        brightness: { type: integer, enum: [0, 1, 2, 3, 4] }
        border: { type: boolean }
    FieldsBlock:
      type: object
      required: [id, type, rows]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        type: { type: string, const: fields }
        rows:
          type: array
          maxItems: 12
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string, maxLength: 40 }
              value: { type: string, maxLength: 200 }
    ListBlock:
      type: object
      required: [id, type, items]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        type: { type: string, const: list }
        items:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
        style: { type: string, const: number }
    ChoiceBlock:
      type: object
      required: [id, type, options]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        type: { type: string, const: choice }
        options:
          type: array
          minItems: 2
          maxItems: 12
          items: { $ref: "#/components/schemas/ChoiceOption" }
    ProgressBlock:
      type: object
      required: [id, type, value]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        type: { type: string, const: progress }
        value: { type: number, minimum: 0, maximum: 1 }
        label: { type: string, maxLength: 120 }
    TableBlock:
      type: object
      required: [id, type, columns, rows]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        type: { type: string, const: table }
        columns:
          type: array
          minItems: 2
          maxItems: 4
          items: { type: string, maxLength: 40 }
        rows:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: array
            items: { type: string, maxLength: 60 }
    DividerBlock:
      type: object
      required: [id, type]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        type: { type: string, const: divider }
    SpacerBlock:
      type: object
      required: [id, type]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        type: { type: string, const: spacer }
        lines: { type: integer, minimum: 1, maximum: 4 }
    ImageBlock:
      type: object
      required: [id, type, url, alt]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        type: { type: string, const: image }
        url: { type: string, format: uri, pattern: "^https://", maxLength: 2048 }
        alt: { type: string, minLength: 1, maxLength: 200 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    DisplayBlock:
      oneOf:
        - $ref: "#/components/schemas/HeadingBlock"
        - $ref: "#/components/schemas/TextBlock"
        - $ref: "#/components/schemas/FieldsBlock"
        - $ref: "#/components/schemas/ListBlock"
        - $ref: "#/components/schemas/ChoiceBlock"
        - $ref: "#/components/schemas/ProgressBlock"
        - $ref: "#/components/schemas/TableBlock"
        - $ref: "#/components/schemas/DividerBlock"
        - $ref: "#/components/schemas/SpacerBlock"
        - $ref: "#/components/schemas/ImageBlock"
      discriminator:
        propertyName: type
        mapping:
          heading: "#/components/schemas/HeadingBlock"
          text: "#/components/schemas/TextBlock"
          fields: "#/components/schemas/FieldsBlock"
          list: "#/components/schemas/ListBlock"
          choice: "#/components/schemas/ChoiceBlock"
          progress: "#/components/schemas/ProgressBlock"
          table: "#/components/schemas/TableBlock"
          divider: "#/components/schemas/DividerBlock"
          spacer: "#/components/schemas/SpacerBlock"
          image: "#/components/schemas/ImageBlock"
    DisplayBlocks:
      description: At most one `choice` block; block ids unique.
      type: array
      minItems: 1
      maxItems: 24
      items: { $ref: "#/components/schemas/DisplayBlock" }

    # ── C4 ──────────────────────────────────────────────────────────────
    DeliverIntent:
      type: string
      enum: [message, ask, notify, display]
    Urgency:
      type: string
      enum: [low, normal, high]
    ActionStatus:
      type: string
      enum: [queued, delivered, done, failed, needs_confirmation]
    DeliverContent:
      description: At least one of text, blocks, options.
      type: object
      minProperties: 1
      properties:
        text: { type: string, minLength: 1 }
        blocks: { $ref: "#/components/schemas/DisplayBlocks" }
        options:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/ChoiceOption" }
    DeliverRequest:
      type: object
      required: [intent, content, urgency, idempotency_key]
      properties:
        intent: { $ref: "#/components/schemas/DeliverIntent" }
        content: { $ref: "#/components/schemas/DeliverContent" }
        urgency: { $ref: "#/components/schemas/Urgency" }
        target:
          description: "`auto`, a device kind, or a device id."
          type: string
          minLength: 1
        profile: { type: string, minLength: 1 }
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
    RoutedTo:
      type: object
      required: [device_id, kind, reason]
      properties:
        device_id: { type: string, minLength: 1 }
        kind: { $ref: "#/components/schemas/DeviceKind" }
        reason: { type: string, minLength: 1 }
    DeliverResponse:
      type: object
      required: [delivery_id, routed_to, status]
      properties:
        delivery_id: { type: string, minLength: 1 }
        routed_to: { $ref: "#/components/schemas/RoutedTo" }
        status: { $ref: "#/components/schemas/ActionStatus" }
    DeviceActionRequest:
      type: object
      required: [args, idempotency_key]
      properties:
        args:
          type: object
          additionalProperties: true
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
    DeviceActionResponse:
      type: object
      required: [action_id, status]
      properties:
        action_id: { type: string, minLength: 1 }
        status: { $ref: "#/components/schemas/ActionStatus" }
    Action:
      type: object
      required: [action_id, device_id, capability, status, result, error, created_at, updated_at]
      properties:
        action_id: { type: string, minLength: 1 }
        device_id: { type: string, minLength: 1 }
        capability: { $ref: "#/components/schemas/CapabilityId" }
        status: { $ref: "#/components/schemas/ActionStatus" }
        result:
          type: [object, "null"]
          additionalProperties: true
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorBody"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── C5 ──────────────────────────────────────────────────────────────
    Posture:
      type: string
      enum: [glanceable, hands_free, seated, driving, unknown]
    ProfileOutput:
      type: object
      additionalProperties: false
      properties:
        max_lines: { type: integer, minimum: 1 }
        max_chars: { type: integer, minimum: 1 }
        format: { type: string, enum: [plain, markdown, blocks] }
        markdown: { type: boolean }
    ProfileMatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind: { $ref: "#/components/schemas/DeviceKind" }
        model: { type: string, minLength: 1 }
        posture: { $ref: "#/components/schemas/Posture" }
    ConfirmationMode:
      type: string
      enum: [none, on_device, trusted_surface, deny]
    ProfileConfirmation:
      description: Per-tier confirmation. T4 may not be `none` (C7).
      type: object
      additionalProperties: false
      properties:
        T0: { $ref: "#/components/schemas/ConfirmationMode" }
        T1: { $ref: "#/components/schemas/ConfirmationMode" }
        T2: { $ref: "#/components/schemas/ConfirmationMode" }
        T3: { $ref: "#/components/schemas/ConfirmationMode" }
        T4:
          type: string
          enum: [on_device, trusted_surface, deny]
    ProfileOverflow:
      description: "D3: limits are enforced, content is never rewritten. No `rewrite` option exists."
      oneOf:
        - type: string
          enum: [truncate, callback]
        - type: object
          additionalProperties: false
          required: [send_to]
          properties:
            send_to: { $ref: "#/components/schemas/DeviceKind" }
    ContextProfile:
      type: object
      additionalProperties: false
      required: [id, match, prompt_append, output, allowed_capabilities, overflow]
      properties:
        id: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
        match: { $ref: "#/components/schemas/ProfileMatch" }
        prompt_append: { type: string }
        output: { $ref: "#/components/schemas/ProfileOutput" }
        allowed_capabilities:
          type: array
          items: { $ref: "#/components/schemas/CapabilityScope" }
        display_template: { type: string, minLength: 1 }
        confirmation: { $ref: "#/components/schemas/ProfileConfirmation" }
        overflow: { $ref: "#/components/schemas/ProfileOverflow" }
    ContextProfileRef:
      type: object
      required: [id, prompt_append, output]
      properties:
        id: { type: string, minLength: 1 }
        prompt_append: { type: string }
        output: { $ref: "#/components/schemas/ProfileOutput" }
    ActiveDevice:
      type: object
      required: [id, kind, model, last_seen_s]
      properties:
        id: { type: string, minLength: 1 }
        kind: { $ref: "#/components/schemas/DeviceKind" }
        model: { type: string }
        last_seen_s: { type: number, minimum: 0 }
    AvailableDevice:
      type: object
      required: [kind, id, capabilities]
      properties:
        kind: { $ref: "#/components/schemas/DeviceKind" }
        id: { type: string, minLength: 1 }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/CapabilityId" }
    DeviceContext:
      type: object
      required: [active_device, posture, available, profile, source_of_last_message]
      properties:
        active_device:
          oneOf:
            - $ref: "#/components/schemas/ActiveDevice"
            - type: "null"
        posture: { $ref: "#/components/schemas/Posture" }
        available:
          type: array
          items: { $ref: "#/components/schemas/AvailableDevice" }
        profile:
          oneOf:
            - $ref: "#/components/schemas/ContextProfileRef"
            - type: "null"
        source_of_last_message:
          oneOf:
            - $ref: "#/components/schemas/DeviceKind"
            - type: "null"

    # ── C8 ──────────────────────────────────────────────────────────────
    EventOutcome:
      type: string
      enum: [ok, error, denied]
    RouteDecision:
      type: object
      required: [target, reason, candidates]
      properties:
        target: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
        candidates:
          type: array
          items: { type: string }
    EventConfirmation:
      type: object
      required: [required, result]
      properties:
        required: { type: boolean }
        result:
          oneOf:
            - type: string
              enum: [approved, denied, timeout]
            - type: "null"
    EventLatency:
      type: object
      required: [api, device_delivery, user_response]
      properties:
        api: { type: number, minimum: 0 }
        device_delivery: { type: [number, "null"], minimum: 0 }
        user_response: { type: [number, "null"], minimum: 0 }
    PublicDeviceEvent:
      description: One logged call, as the developer reads it back. Metering fields are not exposed.
      type: object
      required:
        - event_id
        - ts
        - project_id
        - env
        - external_user_id
        - connection_id
        - device_id
        - device_kind
        - vendor
        - model
        - firmware
        - adapter_version
        - capability
        - intent
        - route_decision
        - profile_id
        - profile_version
        - risk_tier
        - confirmation
        - outcome
        - error_code
        - latency_ms
      properties:
        event_id: { type: string, minLength: 1, description: "Equals the call's `Request-Id` header." }
        ts: { type: string, format: date-time }
        project_id: { type: string, minLength: 1 }
        env: { type: string, enum: [test, live] }
        external_user_id: { type: [string, "null"] }
        connection_id: { type: [string, "null"] }
        device_id: { type: [string, "null"] }
        device_kind:
          oneOf:
            - $ref: "#/components/schemas/DeviceKind"
            - type: "null"
        vendor: { type: [string, "null"] }
        model: { type: [string, "null"] }
        firmware: { type: [string, "null"] }
        adapter_version: { type: [string, "null"] }
        capability:
          oneOf:
            - $ref: "#/components/schemas/CapabilityId"
            - type: "null"
        intent:
          oneOf:
            - $ref: "#/components/schemas/DeliverIntent"
            - type: "null"
        route_decision:
          oneOf:
            - $ref: "#/components/schemas/RouteDecision"
            - type: "null"
        profile_id: { type: [string, "null"] }
        profile_version: { type: [integer, "null"], minimum: 1 }
        risk_tier:
          oneOf:
            - $ref: "#/components/schemas/RiskTier"
            - type: "null"
        confirmation:
          oneOf:
            - $ref: "#/components/schemas/EventConfirmation"
            - type: "null"
        outcome: { $ref: "#/components/schemas/EventOutcome" }
        error_code:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        latency_ms: { $ref: "#/components/schemas/EventLatency" }
    EventListResponse:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PublicDeviceEvent" }
        next_cursor:
          description: Opaque. Pass as `cursor` for the next page. Null on the last page.
          type: [string, "null"]
        has_more: { type: boolean }

    # ── C10 ─────────────────────────────────────────────────────────────
    ErrorType:
      type: string
      enum: [invalid_request_error, authentication_error, permission_error, rate_limit_error, device_error, api_error]
    ErrorCode:
      type: string
      enum:
        - device_offline
        - capability_unsupported
        - grant_missing
        - grant_expired
        - confirmation_denied
        - rate_limited
        - vendor_error
        - needs_reauth
        - invalid_request
        - unauthenticated
        - insufficient_scope
        - not_found
        - idempotency_conflict
    ErrorBody:
      type: object
      required: [type, code, message, retryable, doc_url]
      properties:
        type: { $ref: "#/components/schemas/ErrorType" }
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        device_kind: { $ref: "#/components/schemas/DeviceKind" }
        retryable: { type: boolean }
        doc_url: { type: string, format: uri }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }

    # ── C8 webhooks ─────────────────────────────────────────────────────
    WebhookEventName:
      type: string
      enum:
        - connection.created
        - connection.revoked
        - connection.needs_reauth
        - device.offline
        - device.online
        - action.completed
        - action.failed
        - ask.answered
        - input.utterance
    WebhookEventEnvelope:
      type: object
      description: |
        The body of every webhook POST. Headers (Standard Webhooks): `webhook-id` = `msg_<delivery id>`
        (stable across retries and replays: dedupe on it), `webhook-timestamp` = unix seconds of the
        attempt, `webhook-signature` = `v1,<base64 HMAC-SHA256>` of `${webhook-id}.${webhook-timestamp}.${body}`
        keyed with the base64 part of the `whsec_` secret; during a rotation one `v1,` signature per live
        secret, space-separated. Retries after a non-2xx or no answer within 15s: 5s, 5m, 30m, 2h, 5h,
        10h, 10h; after 8 attempts the delivery is `failed` until replayed. Redirects are not followed.
        Tolerate unknown `type`s and fields.
      required: [id, type, timestamp, livemode, data]
      properties:
        id: { type: string, pattern: "^evt_[0-9a-f-]{36}$" }
        type: { type: string, description: "A `WebhookEventName`, or a newer one." }
        api_version: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        timestamp: { type: string, format: date-time }
        livemode: { type: boolean }
        data:
          type: object
          additionalProperties: true
          description: "`Connection` for `connection.*`, `Action` for `action.*`."
    WebhookEndpointCreateRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 2048, description: "https only." }
        description:
          oneOf: [{ type: string, maxLength: 500 }, { type: "null" }]
        enabled_events:
          description: Omit or null = every event, including types added later.
          oneOf:
            - type: array
              minItems: 1
              maxItems: 50
              items: { $ref: "#/components/schemas/WebhookEventName" }
            - type: "null"
    WebhookEndpointUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url: { type: string, minLength: 1, maxLength: 2048 }
        description:
          oneOf: [{ type: string, maxLength: 500 }, { type: "null" }]
        enabled_events:
          oneOf:
            - type: array
              minItems: 1
              maxItems: 50
              items: { $ref: "#/components/schemas/WebhookEventName" }
            - type: "null"
        disabled: { type: boolean, description: "true stops sending (pending deliveries are dead-lettered); false resumes." }
    WebhookSecretRotateRequest:
      type: object
      additionalProperties: false
      properties:
        overlap_seconds: { type: integer, minimum: 0, maximum: 604800, default: 86400 }
    WebhookEndpoint:
      type: object
      required: [id, url, description, enabled_events, status, livemode, previous_secret_expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { oneOf: [{ type: string }, { type: "null" }] }
        enabled_events:
          oneOf:
            - type: array
              items: { $ref: "#/components/schemas/WebhookEventName" }
            - type: "null"
        status: { type: string, enum: [enabled, disabled] }
        livemode: { type: boolean }
        previous_secret_expires_at:
          description: While a rotated-out secret still signs, when it stops.
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookEndpointWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, pattern: "^whsec_[A-Za-z0-9+/]+={0,2}$" }
    WebhookEndpointDeleted:
      type: object
      required: [id, deleted]
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean, const: true }
    WebhookEndpointList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/WebhookEndpoint" }
        next_cursor: { oneOf: [{ type: string }, { type: "null" }] }
        has_more: { type: boolean }
    WebhookAttempt:
      type: object
      required: [attempt, attempted_at, status_code, error, duration_ms, response_body]
      properties:
        attempt: { type: integer, minimum: 1 }
        attempted_at: { type: string, format: date-time }
        status_code:
          description: null = no HTTP answer (connect error, timeout, refused address).
          oneOf: [{ type: integer }, { type: "null" }]
        error: { oneOf: [{ type: string }, { type: "null" }] }
        duration_ms: { type: integer, minimum: 0 }
        response_body:
          description: First 1 KiB of the response.
          oneOf: [{ type: string }, { type: "null" }]
    WebhookDelivery:
      type: object
      required: [id, endpoint_id, message_id, event_id, event_type, status, attempt_count, next_attempt_at, last_status_code, last_error, delivered_at, created_at]
      properties:
        id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid }
        message_id: { type: string, pattern: "^msg_[0-9a-f-]{36}$", description: "The `webhook-id` header." }
        event_id: { type: string, pattern: "^evt_[0-9a-f-]{36}$" }
        event_type: { $ref: "#/components/schemas/WebhookEventName" }
        status: { type: string, enum: [pending, delivered, failed] }
        attempt_count: { type: integer, minimum: 0, description: "Tries in the current run (a replay resets it)." }
        next_attempt_at: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        last_status_code: { oneOf: [{ type: integer }, { type: "null" }] }
        last_error: { oneOf: [{ type: string }, { type: "null" }] }
        delivered_at: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        attempts:
          description: Present on getWebhookDelivery only. Newest first.
          type: array
          items: { $ref: "#/components/schemas/WebhookAttempt" }
    WebhookDeliveryList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        next_cursor: { oneOf: [{ type: string }, { type: "null" }] }
        has_more: { type: boolean }
