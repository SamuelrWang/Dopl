<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dopl — Offline</title>
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0; height: 100%;
      background: #ffffff; color: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      gap: 16px; padding: 24px;
    }
    .mark {
      width: 44px; height: 44px; border-radius: 11px;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.18));
    }
    h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 6px 0 0; }
    p { margin: 0; color: #8c8c8c; font-size: 14px; max-width: 360px; line-height: 1.5; }
    button {
      margin-top: 10px; padding: 10px 22px; font-size: 14px; font-weight: 500;
      color: #fff; background: linear-gradient(180deg, #313131 0%, #1c1c1c 52%, #111 100%);
      border: 0; border-radius: 9px; cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
      transition: filter .15s ease;
    }
    button:hover { filter: brightness(1.12); }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="assets/icon.png" alt="Dopl" onerror="this.style.display='none'" />
    <h1>Can’t reach Dopl</h1>
    <p>You appear to be offline, or usedopl.com is temporarily unavailable. Check your connection and try again.</p>
    <button id="retry">Retry</button>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', () => {
      location.replace('https://www.usedopl.com/');
    });
  </script>
</body>
</html>
