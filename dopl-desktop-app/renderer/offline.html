<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dopl — Offline</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #0b0b0f; color: #e7e7ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      gap: 18px; padding: 24px;
    }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #ef4444; box-shadow: 0 0 0 6px rgba(239,68,68,.15);
    }
    h1 { font-size: 19px; font-weight: 600; margin: 4px 0 0; }
    p { margin: 0; color: #9a9aa3; font-size: 14px; max-width: 360px; line-height: 1.5; }
    button {
      margin-top: 8px; padding: 10px 22px; font-size: 14px; font-weight: 500;
      color: #fff; background: #6366f1; border: 0; border-radius: 9px;
      cursor: pointer; transition: background .15s ease;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <h1>Can’t reach Dopl</h1>
    <p>You appear to be offline, or usedopl.com is temporarily unavailable. Check your connection and try again.</p>
    <button id="retry">Retry</button>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', () => {
      location.replace('https://www.usedopl.com/');
    });
  </script>
</body>
</html>
