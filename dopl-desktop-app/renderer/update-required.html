<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- This page has no network needs at all: everything it draws arrives over
       the preload bridge. `default-src 'none'` states that, so a future edit
       that reaches for a font or an analytics beacon fails loudly. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Dopl — Update required</title>
  <!--
    THE STYLES BELOW ARE THE DESIGN SYSTEM'S, COPIED VERBATIM, NOT APPROXIMATED.
    This page is outside the React/Tailwind pipeline (it is a local file loaded
    into its own BrowserWindow, and it must render with no network at all), so it
    cannot import the kit. It therefore carries the kit's own recipes as literal
    CSS, transcribed from:

      apps/desktop-ui/src/styles/kit.css   .auth-btn-3d (raised primary) and
                                           .auth-btn-3d-light (raised secondary),
                                           including hover / active / disabled
      apps/desktop-ui/src/styles/tokens.css  --font-app
      src/features/auth/components/login-form-core.tsx  the auth-surface type
                                           scale and ink colors: h 30px/700/
                                           -0.8px/#181818, body 14px/#9a9a9a/1.55,
                                           footnote 12px, and the button geometry
                                           every auth surface uses (h 46px,
                                           radius 10px, 15px/600)
      src/shared/layout/auth-split/auth-split-layout.tsx  the white page

    THIS IS A COPY AND COPIES ROT. It is the same bargain kit.css already made
    with globals.css (see its own DRIFT WARNING header, F-074): when the kit's
    button recipe changes, this file changes in the same commit. Pinned by
    test/update-required-screen.test.mjs, which diffs the recipes against
    kit.css rather than trusting this comment.
  -->
  <style>
    :root {
      color-scheme: light;
      /* kit.css `--raised-light-*` — the raised-light face, as parts. Copied
         here for the same reason every recipe on this page is: the window is a
         local file with NO network and cannot import the kit. `.auth-btn-3d-light`
         is built from these upstream (2026-08-25), so the copy has to be too or
         `test/update-required-screen.test.mjs` diffs the two and fails. */
      --raised-light-face: linear-gradient(180deg, #ffffff 0%, #f2f2f2 100%);
      --raised-light-line: #d4d4d4;
      --raised-light-bevel:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -1px 0 rgba(0, 0, 0, 0.06),
        0 2px 3px rgba(0, 0, 0, 0.08);
      --raised-light-shadow: var(--raised-light-bevel), 0 6px 14px rgba(0, 0, 0, 0.06);
    }
    html, body {
      margin: 0; height: 100%;
      background: #ffffff; color: #181818;
      /* --font-app, with the same system fallback chain globals.css uses so it
         can never drop to the browser's serif default. */
      font-family: "Helvetica Neue", Helvetica, Arial, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none; user-select: none;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      gap: 14px; padding: 28px;
    }
    .mark {
      width: 44px; height: 44px; border-radius: 11px;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.18));
    }
    /* The auth-surface heading: login-form-core.tsx's h2. */
    h1 {
      margin: 8px 0 0;
      font-size: 30px; font-weight: 700; line-height: 1;
      letter-spacing: -0.8px; color: #181818;
    }
    /* The auth-surface body copy. */
    p { margin: 0; color: #9a9a9a; font-size: 14px; max-width: 380px; line-height: 1.55; }
    .status {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      min-height: 21px; margin-top: 2px;
      color: #181818; font-size: 14px; font-weight: 500;
    }
    .spinner {
      width: 13px; height: 13px; border-radius: 50%; flex: none;
      border: 2px solid rgba(24,24,24,.14);
      border-top-color: rgba(24,24,24,.6);
      animation: spin 0.8s linear infinite;
    }
    .spinner[hidden] { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
    /* The auth surfaces put mt-7 (28px) above their primary button; the 14px
       flex gap on .wrap carries the rest of it. */
    .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }

    /* Geometry every auth surface shares (login, reset, OAuth consent). */
    button {
      height: 46px; padding: 0 24px; border-radius: 10px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* kit.css .auth-btn-3d — raised primary: top highlight, bottom shade, drop. */
    button.primary {
      color: #ffffff;
      background: linear-gradient(180deg, #313131 0%, #1c1c1c 52%, #111 100%);
      border: 1px solid #000;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 0 rgba(0, 0, 0, 0.45),
        0 2px 3px rgba(0, 0, 0, 0.22),
        0 6px 16px rgba(0, 0, 0, 0.20);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }
    button.primary:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        inset 0 -1px 0 rgba(0, 0, 0, 0.45),
        0 4px 7px rgba(0, 0, 0, 0.24),
        0 10px 24px rgba(0, 0, 0, 0.24);
    }
    button.primary:active:not(:disabled) {
      transform: translateY(1px);
      filter: brightness(0.96);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* kit.css .auth-btn-3d-light — raised secondary: same volume, white face. */
    button.secondary {
      color: #181818;
      background: var(--raised-light-face);
      border: 1px solid var(--raised-light-line);
      box-shadow: var(--raised-light-shadow);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }
    button.secondary:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(0.99);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 4px 7px rgba(0, 0, 0, 0.1),
        0 10px 20px rgba(0, 0, 0, 0.08);
    }
    button.secondary:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.14),
        0 1px 2px rgba(0, 0, 0, 0.06);
    }

    button[hidden] { display: none; }
    /* kit.css .auth-btn-3d:disabled */
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .foot { margin-top: 8px; color: #9a9a9a; font-size: 12px; line-height: 1.625; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="assets/icon.png" alt="Dopl" onerror="this.style.display='none'" />
    <h1 id="title">Update required</h1>
    <p id="message"></p>
    <div class="status">
      <span class="spinner" id="spinner" hidden></span>
      <span id="status"></span>
    </div>
    <div class="row">
      <button class="primary" id="action" hidden></button>
      <button class="secondary" id="quit">Quit Dopl</button>
    </div>
    <div class="foot">You can quit at any time. Dopl reopens on the new build.</div>
  </div>
  <script>
    const el = (id) => document.getElementById(id);
    const action = el('action');

    // Everything on screen is main's answer. The page holds no state of its own
    // and has no way to decide it is allowed through.
    function render(s) {
      if (!s) return;
      el('title').textContent = s.title || 'Update required';
      el('message').textContent = s.message || '';
      el('status').textContent = s.status || '';
      el('spinner').hidden = !s.busy;
      if (s.action && s.action.id) {
        action.hidden = false;
        action.textContent = s.action.label || '';
        action.dataset.id = s.action.id;
      } else {
        action.hidden = true;
        action.dataset.id = '';
      }
      action.disabled = !!s.busy;
    }

    action.addEventListener('click', () => {
      const id = action.dataset.id;
      if (!id) return;
      // Optimistic only in the narrow sense of "do not let a second click start
      // a second check"; the next push from main is what actually redraws.
      action.disabled = true;
      window.doplUpdate.act(id);
    });
    el('quit').addEventListener('click', () => window.doplUpdate.quit());

    window.doplUpdate.onState(render);
    window.doplUpdate.state().then(render);
  </script>
</body>
</html>
