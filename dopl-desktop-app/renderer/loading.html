<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dopl</title>
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0; height: 100%;
      background: #ffffff; color: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      gap: 16px; padding: 24px;
    }
    .mark {
      width: 44px; height: 44px; border-radius: 11px;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.18));
    }
    h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 6px 0 0; }
    p { margin: 0; color: #8c8c8c; font-size: 14px; max-width: 360px; line-height: 1.5; }
    .spinner {
      margin-top: 6px;
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(0,0,0,.12);
      border-top-color: rgba(0,0,0,.55);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="assets/icon.png" alt="Dopl" onerror="this.style.display='none'" />
    <h1>Getting Dopl ready</h1>
    <p>Loading your workspace. This will just take a moment.</p>
    <div class="spinner" aria-label="Loading"></div>
  </div>
</body>
</html>
