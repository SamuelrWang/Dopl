<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Local-only surface. No remote content, no network: default-src 'none'
       blocks fetch/XHR/WS; scripts + styles are same-origin local files. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none';" />
  <title>Dopl Session</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="session.css" />
</head>
<body>
  <div class="app page-float" id="app">

    <!-- Header -->
    <header class="session-header">
      <div class="header-id">
        <div class="header-title-row">
          <span class="peer-avatar" id="peerAvatar" aria-hidden="true"></span>
          <span class="channel-name" id="channelName">Session</span>
        </div>
        <!-- v3.0 VOCABULARY: the wire name `task` == the domain name `thread`. The element
             id + class stay `taskTitle` / `task-title` because they mirror the `init.taskTitle`
             wire field (from `metadata.taskTitle`); only the COPY moves to "thread". -->
        <div class="task-title text-caption" id="taskTitle"></div>
      </div>
      <!-- The Stop button is gone (v3.1): pausing the agent is the send button's pause morph
           (session-chrome.sendButtonMode), which now covers every in-flight state, so a second
           control for the same act only competed with it.

           CLOSE THREAD IS BACK (P1-6, 2026-08-04). v3.1 removed it because closing settles the
           SHARED thread for BOTH members and so "belongs with the thread". That is true and it
           was not enough: nothing else closed either (no layer linked a responder's "I am
           finished" to channel_tasks, and threads sat open for months), and decision 2 now makes
           the HUMAN the only closer at all. Taking the control out of the window where the
           operator watches the work, while also taking it away from the agent, left the thread
           open unless somebody remembered another surface. The bridge, IPC and reducer branch
           were left intact for exactly this; session-close-ui.js is the path back to them. -->
      <div class="header-controls">
        <button class="ctl btn-light ctl-sm" id="btnCloseThread" type="button" hidden>Close thread</button>
        <button class="ctl btn-light ctl-sm ctl-danger" id="btnEnd" type="button">End session</button>
      </div>
    </header>

    <!-- The close panel. Hidden until the operator asks for it, and hidden again the moment the
         session has nothing to close (no first-class thread, or already settled). -->
    <section class="close-panel" id="closePanel" hidden>
      <p class="text-caption" id="closeNote"></p>
      <input class="concave-field" id="closeSummary" type="text" maxlength="2000"
             placeholder="Add a closing summary (optional)" />
      <div class="close-actions">
        <button class="ctl btn-light ctl-sm" id="btnCloseCancel" type="button">Cancel</button>
        <button class="ctl btn-light ctl-sm ctl-danger" id="btnCloseFailed" type="button">Mark failed</button>
        <button class="ctl btn-light ctl-sm" id="btnCloseDone" type="button">Mark complete</button>
      </div>
    </section>

    <!-- Status strip: status pill · the TWO permission axes (v2.9) · posture line ·
         working-directory pill (item 5).

         AXIS A (Tools) is what MY agent may do on THIS machine; AXIS B (Messages) is what
         crosses between machines. They are separate controls because they are separate
         risks: the single "Auto-approve" checkbox they replace meant that turning on
         hands-off messaging also granted arbitrary Bash / Write / Edit. Neither select can
         reach the other's decisions, and neither can reach the hard-deny set.
         Option labels are STATIC markup (never built from a string); the posture line and
         the bypass warning are filled by session.js via textContent. -->
    <div class="status-strip">
      <span class="status-pill">
        <span class="status-dot is-launching" id="statusDot"></span>
        <span class="status-label" id="statusLabel">Launching</span>
      </span>
      <span class="status-meta" id="statusMeta"></span>
      <label class="mode-select">
        <span class="mode-select__lbl text-label">Tools</span>
        <select class="mode-select__input" id="toolMode">
          <option value="manual">Manual</option>
          <option value="accept_edits">Accept edits</option>
          <option value="auto">Auto</option>
          <option value="bypass">Bypass</option>
        </select>
      </label>
      <label class="mode-select">
        <span class="mode-select__lbl text-label">Messages</span>
        <select class="mode-select__input" id="messageMode">
          <option value="ask">Ask every time</option>
          <option value="auto_inbound">Auto accept incoming</option>
          <option value="auto_outbound">Auto send outgoing</option>
          <option value="auto_both">Both automatic</option>
        </select>
      </label>
      <!-- THE MODEL (2026-08-02). It sits with the two axes because it belongs to the same
           "what is this session doing" row, but it wears `model-select` rather than
           `mode-select`: it is NOT a third permission axis, it approves and denies nothing,
           and the pair above must stay countable as exactly two. The option VALUES are the
           frozen enum from main/session-model.js (they become child argv), and the labels are
           static markup like every other option in this strip. "Default" is the CLI's own
           pick, which is what every session ran on before this control existed. -->
      <label class="model-select">
        <span class="mode-select__lbl text-label">Model</span>
        <select class="mode-select__input" id="modelMode">
          <option value="default">Default</option>
          <option value="opus">Opus</option>
          <option value="sonnet">Sonnet</option>
          <option value="haiku">Haiku</option>
          <option value="fable">Fable</option>
        </select>
      </label>
      <span class="perm-posture text-caption" id="permPosture"></span>
      <!-- The danger-token callout for `bypass`, and the only place that says it is per
           session. Empty + hidden in every other mode. -->
      <span class="perm-warn text-caption hidden" id="permWarn"></span>
      <!-- THE CONTEXT METER (2026-08-02): how full this session's window is, measured by main
           after every turn. Empty until the first turn ends, and tokens-only when this build
           does not know the running model's window size (never a made-up percentage). The
           title is the operator's actual question answered in one line: it is what to DO about
           a full window, and it is static copy, so it lives in the markup like every other
           fixed string here. The number itself arrives via textContent. -->
      <span class="ctx-meter text-caption" id="ctxMeter"
            title="How much of this session's context window the last turn used. Context does not shrink on its own. To clear it, end this session and open a fresh one."></span>
      <!-- THE REQUEST LIFECYCLE STRIP (2026-08-02): what happened to the request the operator
           SENT, in one word. Empty and hidden on every session that never sent one, which is
           every responder and every summoned agent. The words arrive via textContent from
           session-request-ui.js; the title is fixed copy, so it lives in the markup like the
           context meter's does. -->
      <span class="request-status text-caption hidden" id="requestStatus"
            title="Where the request you sent has got to: sent, accepted or declined by the person you addressed, then replied."></span>
      <span class="status-spacer"></span>
      <button class="folder-pill" id="folderPill" type="button">Working Directory: <span class="folder-pill__label" id="folderLabel">~/Downloads</span></button>
    </div>

    <!-- Pre-consent request card (item 8): shown BEFORE any SDK/agent work. -->
    <div class="consent-view" id="consentView"></div>

    <!-- Turn stream. The thinking chip sits OUTSIDE #stream on purpose: the stream owns its own
         scroll pin (session.js SESSION-SCROLL-PURE), and an element inside it would change the
         tail fingerprint on every turn and yank a reader out of the band they parked in. Static
         markup, toggled by one class; the dots animate in CSS, no timer and no innerHTML. -->
    <div class="stream-wrap">
      <div class="stream" id="stream" aria-live="polite"></div>
    </div>
    <div class="thinking-chip" id="thinkingChip" aria-live="polite">
      <span class="thinking-chip__label">Thinking</span>
      <span class="thinking-chip__dots" aria-hidden="true">
        <span class="thinking-chip__dot"></span>
        <span class="thinking-chip__dot"></span>
        <span class="thinking-chip__dot"></span>
      </span>
    </div>

    <!-- Permission dock -->
    <div class="permission-dock" id="permissionDock">
      <div class="perm-card bento">
        <div class="perm-card__head">
          <span class="lbl">Permission</span>
          <span class="tool" id="permTool"></span>
        </div>
        <div class="perm-card__body">
          <div class="perm-summary" id="permSummary"></div>
          <!-- v2.5 D2: the drafted message body of a gated dopl_channel post, shown in
               full so the operator approves WHAT is being sent. Hidden for every other
               tool. Filled via textContent only. -->
          <div class="perm-post-label text-label hidden" id="permPostLabel">Message</div>
          <!-- FIX #9: WHERE the post is going. A cross-channel post used to look exactly
               like a normal reply, which is the exfil case the outbound gate exists to
               catch. Filled via textContent; the cross class carries the warning tint. -->
          <div class="perm-post-to text-caption hidden" id="permPostTo"></div>
          <!-- 2026-08-02: WHY this card is on screen. The inline outbound card has carried the
               gate reason since the reason codes landed; the dock (Bash / Write / a
               CROSS-channel post) did not, so an uncovered tool under `bypass` still read as a
               broken toggle there. One line, filled via textContent from a closed code table
               (session-render.gateReasonText); an unknown code renders nothing. -->
          <div class="perm-why text-caption hidden" id="permWhy"></div>
          <div class="perm-post concave-field hidden" id="permPost"></div>
          <details id="permDetails">
            <summary>Show full input</summary>
            <pre id="permInput"></pre>
          </details>
          <!-- v3.0 VOCABULARY + CORRECTNESS: the standing grant is per SESSION and is cleared
               on park (v2.9 FIX F1), so "for this task" overstated its lifetime — a thread
               outlives every session that works it. The button id and the `allow-task`
               decision string are the IPC wire vocabulary and are unchanged (wire name
               `task` == domain name `thread`); only the words the operator reads move. -->
          <div class="perm-actions">
            <button class="ctl btn-light ctl-sm" id="btnAllowOnce" type="button">Allow once</button>
            <button class="ctl auth-btn-3d ctl-primary ctl-sm" id="btnAllowTask" type="button">Allow for this session</button>
            <button class="ctl btn-light ctl-sm ctl-danger" id="btnDeny" type="button">Deny</button>
          </div>
          <div class="perm-queue-note hidden" id="permQueueNote"></div>
        </div>
      </div>
    </div>

    <!-- Q6: the Claude Code sign-in banner. Hidden until main holds this session on a missing
         credential (preflight) or an auth-shaped SDK failure. Every string is filled by
         session-auth-ui.js via textContent; the copy names WHICH credential is missing and
         never mentions a terminal command (the `claude` binary ships inside the app). -->
    <div class="auth-notice bento" id="authNotice" role="status">
      <div class="auth-notice__text">
        <div class="auth-notice__title text-label" id="authTitle"></div>
        <div class="auth-notice__body text-caption" id="authBody"></div>
        <div class="auth-notice__note text-caption hidden" id="authNote"></div>
      </div>
      <button class="ctl auth-btn-3d ctl-primary ctl-sm" id="btnAuthSignIn" type="button">Sign in to Claude</button>
    </div>

    <!-- Ended banner -->
    <div class="ended-banner" id="endedBanner"></div>

    <!-- Composer (steering). The send button MORPHS: an up-arrow while the agent is
         idle (click = send the steer), a pause glyph while a turn is running (click =
         interrupt). Both glyphs are INLINE SVG — the CSP allows no external asset. -->
    <div class="composer">
      <!-- v2.8 put an @-TAG POPUP here, out of flow above the field: one row to steer this
           session, one to post the operator's own words to the peer. Both halves are gone
           (channels rollback §1); phase 4 replaces the peer half with a PILL inside the
           input, and every draft is a steer until it does. -->
      <div class="composer__field concave-field">
        <textarea class="steer-input" id="steerInput" rows="1"></textarea>
        <div class="composer__controls">
          <button class="send-btn auth-btn-3d" id="btnSend" type="button" aria-label="Send">
            <svg class="send-btn__glyph send-btn__glyph--send" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M8 13V3.6M8 3.2 3.9 7.3M8 3.2l4.1 4.1" fill="none" stroke="currentColor"
                    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <svg class="send-btn__glyph send-btn__glyph--pause" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="4.4" y="3.6" width="2.6" height="8.8" rx="1.1" fill="currentColor" />
              <rect x="9" y="3.6" width="2.6" height="8.8" rx="1.1" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="session-labels.js"></script>
  <script src="session-format.js"></script>
  <script src="session-history-vm.js"></script>
  <!-- §2 split: the outbound decision card's two transitions. The view-model requires it at
       load and THROWS without it, so it must come first. -->
  <script src="session-outbound-vm.js"></script>
  <script src="session-viewmodel.js"></script>
  <script src="session-chrome.js"></script>
  <script src="session-render.js"></script>
  <!-- F-118: the attended-handoff button on the pre-consent card. Loaded BEFORE the
       controller, which reads its global and hands it to session-render's makeConsent. -->
  <script src="session-attended-ui.js"></script>
  <!-- FIX 2: the two posture selects below own their own refusal path (revert + one line)
       and the enabled/disabled rule for the accept -> init adoption gap. Loaded BEFORE the
       controller, which mounts it once and syncs it from renderStatus. -->
  <script src="session-modes-ui.js"></script>
  <script src="session-close-ui.js"></script>
  <script src="session-folder-ui.js"></script>
  <script src="session.js"></script>
  <!-- Q6: the sign-in banner owns its own element + its own narrow bridge sink, so it is
       independent of the transcript controller above and loads after it. -->
  <script src="session-auth-ui.js"></script>
  <!-- 2026-08-02: the request lifecycle strip, on exactly the same terms as the banner above —
       one element, one narrow sink, nothing added to the three at-cap files. -->
  <script src="session-request-ui.js"></script>
</body>
</html>
