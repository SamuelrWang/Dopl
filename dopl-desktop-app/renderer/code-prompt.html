<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Sign in to Claude</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0f;
      color: #e8e8ec;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .wrap { padding: 22px 24px 20px; }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
    p { font-size: 12.5px; line-height: 1.5; color: #a0a0aa; margin: 0 0 16px; }
    label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a8a94; margin: 0 0 6px; }
    input {
      width: 100%; padding: 10px 12px; font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: #e8e8ec; background: #17171d; border: 1px solid #2a2a33; border-radius: 8px; outline: none;
      user-select: text;
    }
    input:focus { border-color: #4b4bff; }
    .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    button {
      font-size: 12.5px; font-weight: 500; padding: 8px 16px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
    }
    .cancel { background: transparent; color: #b8b8c2; border-color: #2a2a33; }
    .cancel:hover { background: #17171d; }
    .submit { background: #4b4bff; color: #fff; }
    .submit:hover { background: #5a5aff; }
    .submit:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Finish signing in to Claude</h1>
    <p>Your browser opened the Claude sign-in page. After you approve, paste the
       authorization code it shows below.</p>
    <label for="code">Authorization code</label>
    <input id="code" type="text" autocomplete="off" spellcheck="false" placeholder="Paste code here" />
    <div class="row">
      <button class="cancel" id="cancel" type="button">Cancel</button>
      <button class="submit" id="submit" type="button" disabled>Submit</button>
    </div>
  </div>
  <script>
    (function () {
      var input = document.getElementById('code');
      var submit = document.getElementById('submit');
      var cancel = document.getElementById('cancel');
      function sync() { submit.disabled = input.value.trim().length === 0; }
      function send() {
        var v = input.value.trim();
        if (!v) return;
        submit.disabled = true;
        window.codePrompt.submit(v);
      }
      input.addEventListener('input', sync);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); send(); }
        else if (e.key === 'Escape') { e.preventDefault(); window.close(); }
      });
      submit.addEventListener('click', send);
      cancel.addEventListener('click', function () { window.close(); });
      input.focus();
    })();
  </script>
</body>
</html>
