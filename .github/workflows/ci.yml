# CI for the whole repo. No path filters: a filter would let a `src/` PR skip the `src/` suite.
# Every step here is part of the definition of green (CLAUDE.md, INVARIANTS §14).
name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # >=22: the desktop's `node --test` glob needs it.
        node: [22]
        # macOS only (Dopl ships one platform). Tooling jobs below stay on ubuntu: they test no
        # platform, the RLS job needs Docker, and macOS minutes bill at 10x.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @dopl/client
        run: npm run build -w @dopl/client

      - name: Build @dopl/mcp-server
        run: npm run build -w @dopl/mcp-server

      - name: Test @dopl/client
        run: npm test -w @dopl/client

      # One step per suite, so a failure names its tree.
      - name: Test root suite
        run: npm test

      - name: Test @dopl/mcp-server
        run: npm test -w @dopl/mcp-server

      - name: Test @dopl/desktop-ui (the bundled SPA)
        run: npm test -w @dopl/desktop-ui

  # The desktop app is a separate npm project (own lockfile). Its suite is `node --test` over
  # source-extraction truth tables; no Electron binary is launched.
  desktop:
    name: desktop app (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: dopl-desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # `--ignore-scripts` skips the Electron binary download this suite never uses.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      # The 500-line cap and `no-redeclare` both live here and both are `error`.
      - name: Lint
        run: npm run lint

  typecheck-lint:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Root `tsconfig.json` excludes `apps` and `packages`: `src/` + `scripts/` + the Next tree.
      - name: Typecheck (root)
        run: npm run typecheck

      # The SPA is outside the root program and vitest does not typecheck, so it gets its own step
      # (also the only compile cover for its unrouted leftovers under `pages/`).
      - name: Typecheck @dopl/desktop-ui (the bundled SPA)
        run: npm run typecheck -w @dopl/desktop-ui

      # 0 errors and 0 warnings.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      # Doc anchors: files exist, F-ids resolve, `path › symbol` anchors resolve. Not covered by
      # `npm run lint` (`eslint.config.mjs` ignores `scripts/**`). Last: cheapest, least urgent.
      - name: Doc references (files exist, F-ids resolve, symbol anchors resolve)
        run: node scripts/check-doc-refs.mjs

  size-check:
    name: file size cap (500 lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 500-line hard cap in packages/
        shell: bash
        run: |
          set -eu
          # Nothing is exempt; the web tree's exemptions live in `eslint.config.mjs`. A split into
          # re-export shims is the only way to close a red here. The placeholder keeps `grep -vF`
          # safe: an empty ALLOW would filter every line.
          ALLOW=$(printf '%s\n' \
            '__no_exemptions__')

          BAD=$(find packages -type f \( -name '*.ts' -o -name '*.tsx' \) \
            ! -path '*/dist/*' ! -path '*/node_modules/*' \
            -exec awk 'END { if (NR > 500) print FILENAME, NR }' {} \; \
            | grep -vF "$ALLOW" || true)
          if [ -n "$BAD" ]; then
            echo "Files over 500 lines:"
            echo "$BAD"
            exit 1
          fi
          echo "All files within the 500-line cap."

  # The hand-mirror gates: declarations that exist in two or more trees with no shared module.
  # The job name predates every family after the first.
  type-drift:
    name: knowledge type-drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Knowledge field names and the shelf vocabulary (unions, dist/ mirrors, `readShelf` guards).
      - name: Diff knowledge types and the shelf vocabulary
        run: npx tsx scripts/check-knowledge-type-drift.ts

      # The role set, the workspace list-item fields, and `WorkspaceKind` (F-295).
      - name: Diff workspace role set across server, SDK and MCP
        run: npx tsx scripts/check-role-drift.ts

      # The session-health fields: optional and nullable by design, so drift fails nothing else.
      - name: Diff the session-health field set across its four mirrors
        run: npx tsx scripts/check-session-health-drift.ts

      # `channel_messages` kind/author_kind sets vs the column CHECK (the zod half is a compile error).
      - name: Diff the message-kind sets across the union, the SDK and the column CHECK
        run: npx tsx scripts/check-message-kind-drift.ts

      # `tokens.css`/`kit.css` are hand copies of `globals.css` (F-074): tokens and kit class names.
      - name: Diff design tokens between globals.css and the SPA's tokens.css
        run: npx tsx scripts/check-css-token-drift.ts

      # Every `canSee*` predicate has a named SELECT-policy twin and each covered table's SELECT
      # surface is the declared one. It does not claim the two agree (the redteam suites do).
      - name: Pair every canSee* predicate with a live SELECT policy
        run: npx tsx scripts/check-rls-pair-gate.ts

      # Every preload bridge member is named by SPA code (declaration files excluded, or the gate
      # would pass on the orphan it exists to catch).
      - name: Every preload bridge member has a caller in the SPA
        run: node scripts/check-bridge-caller-drift.mjs

      # A migration that re-stamps a parent's `workspace_id` re-stamps every child (F-664).
      - name: A tenancy move takes its children with it
        run: npx tsx scripts/check-tenancy-move-gate.ts

      # The committed `dist/` is what the app loads (`serverExternalPackages`), so it must be the
      # build of `src/` (F-452). The build is a precondition; the `git status` below is the gate.
      - name: Build the packages
        run: npm run build:packages

      - name: Fail if the committed dist/ is not the build of src/
        run: |
          # Scoped to dist/. The pathspec's trailing `/*` IS the gate: a glob must match the whole
          # path, so `packages/*/dist` matches nothing; `*` crosses `/` in a pathspec.
          DIRTY=$(git status --porcelain -- 'packages/*/dist/*')
          if [ -n "$DIRTY" ]; then
            echo "::error::packages/*/dist is stale — run 'npm run build:packages' and commit the result."
            echo "$DIRTY"
            git diff --stat -- 'packages/*/dist'
            exit 1
          fi

  # The live half of the RLS redteam suites — the only gate that can say Postgres agrees (F-523).
  # `supabase db reset` also replays every migration, so this is the migration-replay gate too.
  # The local skip stays: `liveRedteamEnabled` also needs a loopback Supabase URL.
  rls-redteam:
    name: RLS redteam (live, against a real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned: resolving `latest` is an unauthenticated GitHub API call that can rate-limit.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # A migration that cannot apply fails here, with the SQL error, not on a production apply.
      - name: Start Supabase and replay every migration
        run: |
          supabase start
          supabase db reset

      # The local stack's own keys, read back: loopback-only, not secrets.
      - name: Export the local stack's credentials
        run: |
          set -eu
          status=$(supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | jq -r .ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r .SERVICE_ROLE_KEY)"
            echo "SUPABASE_JWT_SECRET=$(echo "$status" | jq -r .JWT_SECRET)"
          } >> "$GITHUB_ENV"

      # `RLS_REDTEAM_LIVE=1` changes only the redteam suites, so the run is filtered to them: vitest's
      # path filter picks up every `*rls-redteam*` test file, including a new one (and fails on none).
      - name: Run the redteam suites with the live half ARMED
        env:
          RLS_REDTEAM_LIVE: "1"
        run: npx vitest run rls-redteam

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
